# push するたびに PDF と pdfpc 用ファイルを生成し、Actions の Artifacts に保存する
name: Build slides

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ヒラギノの代わりに使う和文フォント
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.37

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: slides
          path: |
            slides.pdf
            slides.pdfpc
